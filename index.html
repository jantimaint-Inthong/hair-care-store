
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAIR CARE STORE</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fffaf7;
  color: #493b35;
}
header {
  background: #8c6658;
  color: white;
  padding: 25px 8%;
  text-align: center;
}
header h1 { margin: 0 0 8px; letter-spacing: 2px; }
nav {
  background: #eadbd3;
  padding: 14px;
  text-align: center;
}
nav button {
  border: 0;
  background: transparent;
  padding: 10px 18px;
  cursor: pointer;
  font-size: 16px;
  color: #493b35;
}
.container { max-width: 1100px; margin: auto; padding: 30px 18px; }
h2 { text-align: center; }
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 22px;
}
.card {
  background: white;
  border-radius: 14px;
  padding: 18px;
  text-align: center;
  box-shadow: 0 3px 12px #00000012;
}
.card img {
  width: 100%;
  height: 220px;
  object-fit: contain;
  border-radius: 10px;
}
.price { color: #a65e48; font-weight: bold; font-size: 20px; }
button.action {
  background: #9b6e5c;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 11px 18px;
  cursor: pointer;
  margin: 5px;
}
button.action:hover { background: #765044; }
input, textarea, select {
  width: 100%;
  padding: 11px;
  margin: 7px 0 14px;
  border: 1px solid #d8c5bb;
  border-radius: 7px;
}
.panel {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin: 15px 0;
}
.hidden { display: none; }
table { width: 100%; border-collapse: collapse; background: white; }
th, td { border: 1px solid #eadbd3; padding: 10px; text-align: left; }
th { background: #eadbd3; }
footer {
  background: #8c6658;
  color: white;
  padding: 20px;
  text-align: center;
}
</style>
</head>
<body>

<header>
  <h1>HAIR CARE STORE</h1>
  <p>ดูแลเส้นผมของคุณ ด้วยผลิตภัณฑ์ที่ใช่</p>
</header>

<nav>
  <button onclick="showPage('shop')">หน้าร้านค้า</button>
  <button onclick="showPage('cart')">ตะกร้าสินค้า</button>
  <button onclick="showPage('orders')">จัดการคำสั่งซื้อ</button>
</nav>

<main class="container">

<section id="shop">
  <h2>ผลิตภัณฑ์ของเรา</h2>
  <div id="products" class="products"></div>
</section>

<section id="cart" class="hidden">
  <h2>ตะกร้าสินค้า</h2>
  <div id="cartItems" class="panel"></div>
  <h3 id="total"></h3>

  <div class="panel">
    <h3>ข้อมูลผู้สั่งซื้อ</h3>
    <label>ชื่อ-นามสกุล</label>
    <input id="customer" placeholder="กรอกชื่อผู้รับ">
    <label>เบอร์โทรศัพท์</label>
    <input id="phone" placeholder="กรอกเบอร์โทรศัพท์">
    <label>ที่อยู่จัดส่ง</label>
    <textarea id="address" rows="3" placeholder="กรอกที่อยู่จัดส่ง"></textarea>
    <button class="action" onclick="placeOrder()">ยืนยันคำสั่งซื้อ</button>
  </div>
</section>

<section id="orders" class="hidden">
  <h2>ระบบจัดการคำสั่งซื้อ</h2>
  <div id="orderList"></div>
</section>

</main>

<footer>
  <p>HAIR CARE STORE | ขอบคุณที่เลือกซื้อสินค้ากับเรา</p>
</footer>

<script>
const products = [
  {
    sku: "SH001",
    name: "Soft Shampoo",
    description: "แชมพูสูตรผมนุ่ม",
    price: 159,
    stock: 50,
    image: "SHAMPOO1.JPG"
  },
  {
    sku: "SH002",
    name: "Hair Fall Shampoo",
    description: "แชมพูสูตรลดผมร่วง",
    price: 189,
    stock: 30,
    image: "SHAMPOO2.JPG"
  }
];

let cart = [];
let orders = JSON.parse(localStorage.getItem("hairOrders") || "[]");

function showPage(page) {
  ["shop", "cart", "orders"].forEach(id => {
    document.getElementById(id).classList.add("hidden");
  });
  document.getElementById(page).classList.remove("hidden");
  if (page === "cart") renderCart();
  if (page === "orders") renderOrders();
}

function renderProducts() {
  document.getElementById("products").innerHTML = products.map((p, i) => `
    <div class="card">
      <img src="${p.image}" alt="${p.name}"
        onerror="this.src='https://placehold.co/400x300?text=Shampoo'">
      <h3>${p.name}</h3>
      <p>${p.description}</p>
      <p>รหัสสินค้า: ${p.sku}</p>
      <p class="price">${p.price} บาท</p>
      <p>คงเหลือ ${p.stock} ชิ้น</p>
      <button class="action" onclick="addToCart(${i})">เพิ่มลงตะกร้า</button>
    </div>
  `).join("");
}

function addToCart(index) {
  const p = products[index];
  const found = cart.find(item => item.sku === p.sku);
  const quantity = found ? found.quantity : 0;

  if (quantity >= p.stock) {
    alert("สินค้าไม่เพียงพอ");
    return;
  }

  if (found) found.quantity++;
  else cart.push({ ...p, quantity: 1 });

  alert("เพิ่มสินค้าลงตะกร้าแล้ว");
}

function renderCart() {
  const area = document.getElementById("cartItems");

  if (cart.length === 0) {
    area.innerHTML = "ยังไม่มีสินค้าในตะกร้า";
    document.getElementById("total").innerText = "รวม 0 บาท";
    return;
  }

  area.innerHTML = cart.map((p, i) => `
    <p>
      ${p.name} — ${p.price} บาท
      <button onclick="changeQty(${i},-1)">-</button>
      ${p.quantity}
      <button onclick="changeQty(${i},1)">+</button>
      <button onclick="removeItem(${i})">ลบ</button>
    </p>
  `).join("");

  document.getElementById("total").innerText =
    "รวม " + cart.reduce((sum,p) => sum + p.price*p.quantity, 0) + " บาท";
}

function changeQty(index, amount) {
  const item = cart[index];
  const product = products.find(p => p.sku === item.sku);
  const next = item.quantity + amount;

  if (next > product.stock) {
    alert("สินค้าในสต็อกไม่เพียงพอ");
    return;
  }

  item.quantity = next;
  if (item.quantity <= 0) cart.splice(index, 1);
  renderCart();
}

function removeItem(index) {
  cart.splice(index, 1);
  renderCart();
}

function placeOrder() {
  const customer = document.getElementById("customer").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();

  if (!cart.length) return alert("กรุณาเลือกสินค้าก่อน");
  if (!customer || !phone || !address) {
    return alert("กรุณากรอกข้อมูลให้ครบ");
  }

  for (const item of cart) {
    const p = products.find(x => x.sku === item.sku);
    if (item.quantity > p.stock) {
      return alert("สินค้า " + p.name + " มีไม่เพียงพอ");
    }
  }

  const order = {
    id: "ORD" + Date.now(),
    customer,
    phone,
    address,
    items: cart.map(p => ({...p})),
    total: cart.reduce((sum,p) => sum + p.price*p.quantity, 0),
    status: "รอหยิบสินค้า",
    date: new Date().toLocaleString("th-TH")
  };

  orders.push(order);
  localStorage.setItem("hairOrders", JSON.stringify(orders));

  cart.forEach(item => {
    const p = products.find(x => x.sku === item.sku);
    p.stock -= item.quantity;
  });

  cart = [];
  alert("สั่งซื้อสำเร็จ เลขที่คำสั่งซื้อ " + order.id);
  showPage("orders");
  renderProducts();
}

function updateStatus(index, status) {
  orders[index].status = status;
  localStorage.setItem("hairOrders", JSON.stringify(orders));
  renderOrders();
}

function printLabel(index) {
  const o = orders[index];
  const w = window.open("", "_blank");
  w.document.write(`
    <html><head><title>ใบปะหน้าพัสดุ</title>
    <style>body{font-family:Arial;padding:30px}
    .label{border:2px solid black;padding:25px;max-width:500px}
    </style></head><body>
    <div class="label">
      <h2>ใบปะหน้าพัสดุ</h2>
      <h3>HAIR CARE STORE</h3>
      <p>เลขคำสั่งซื้อ: ${o.id}</p>
      <hr>
      <h3>ผู้รับ: ${o.customer}</h3>
      <p>โทร: ${o.phone}</p>
      <p>ที่อยู่: ${o.address}</p>
      <hr><p>ยอดชำระ: ${o.total} บาท</p>
    </div>
    <script>window.onload=()=>window.print();<\/script>
    </body></html>
  `);
  w.document.close();
}

function renderOrders() {
  const area = document.getElementById("orderList");

  if (!orders.length) {
    area.innerHTML = "<p>ยังไม่มีคำสั่งซื้อ</p>";
    return;
  }

  area.innerHTML = orders.map((o, i) => `
    <div class="panel">
      <h3>คำสั่งซื้อ ${o.id}</h3>
      <p>วันที่: ${o.date}</p>
      <p>ลูกค้า: ${o.customer}</p>
      <p>โทร: ${o.phone}</p>
      <p>ที่อยู่: ${o.address}</p>
      <p>สินค้า: ${o.items.map(p => p.name + " x " + p.quantity).join(", ")}</p>
      <p><b>ยอดรวม: ${o.total} บาท</b></p>
      <p>สถานะ: <b>${o.status}</b></p>
      <button class="action" onclick="updateStatus(${i},'กำลังแพ็กสินค้า')">แพ็กสินค้า</button>
      <button class="action" onclick="updateStatus(${i},'จัดส่งแล้ว')">จัดส่งแล้ว</button>
      <button class="action" onclick="printLabel(${i})">พิมพ์ใบปะหน้า</button>
    </div>
  `).join("");
}

renderProducts();
</script>
</body>
</html>
